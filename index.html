<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 6 形容詞最高級大挑戰！</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --accent: #F59E0B;
      --success: #10B981;
      --error: #EF4444;
      --bg: #F8FAFC;
      --text: #1E293B;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Nunito', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-weight: 700;
      color: #64748B;
      font-size: 0.95rem;
    }

    .score-badge {
      background: #FEF3C7;
      color: #B45309;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1rem;
    }

    .rule-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .prompt-box {
      background: #F1F5F9;
      border-radius: 20px;
      padding: 22px 16px;
      margin-bottom: 24px;
      border: 2px dashed #CBD5E1;
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.5;
    }

    .target-word {
      color: var(--primary);
      text-decoration: underline;
      text-decoration-thickness: 3px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .btn-option {
      background: #FFFFFF;
      border: 2.5px solid #E2E8F0;
      color: #334155;
      padding: 16px 10px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.2);
    }

    .btn-option:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-option.correct {
      background: #D1FAE5 !important;
      border-color: var(--success) !important;
      color: #065F46 !important;
    }

    .btn-option.wrong {
      background: #FEE2E2 !important;
      border-color: var(--error) !important;
      color: #991B1B !important;
    }

    .feedback-box {
      min-height: 52px;
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.35);
      transition: all 0.2s;
    }

    .btn-action:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .end-screen {
      display: none;
    }

    .trophy {
      font-size: 4rem;
      margin-bottom: 12px;
      animation: bounce 1.2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- 遊戲進行中畫面 -->
    <div id="quiz-screen">
      <div class="top-bar">
        <span id="question-progress">第 1 / 6 題</span>
        <span class="score-badge">⭐ <span id="current-score">0</span> 分</span>
      </div>

      <div class="rule-tag" id="rule-tag">變化規則</div>

      <div class="prompt-box">
        <div class="question-title" id="question-text">題目載入中...</div>
      </div>

      <div class="options-grid" id="options-container"></div>

      <div class="feedback-box" id="feedback-text"></div>

      <button class="btn-action" id="next-btn" style="display: none;" onclick="nextQuestion()">下一題 👉</button>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen" class="end-screen">
      <div class="trophy">🏆</div>
      <h2 style="font-size: 1.8rem; margin-bottom: 8px;">太棒了！挑戰完成</h2>
      <p style="color: #64748B; font-weight: 600; margin-bottom: 24px;">你已經掌握 Unit 6 形容詞最高級的規則！</p>
      
      <div class="prompt-box">
        <div style="font-size: 1.1rem; font-weight: 700; color: #475569;">最終總得分</div>
        <div style="font-size: 2.8rem; font-weight: 800; color: var(--primary);" id="final-score">0</div>
      </div>

      <!-- 登記成績輸入區 -->
      <div id="submit-section" style="margin-bottom: 20px;">
        <input type="text" id="player-name" placeholder="請輸入你的名字或座號" style="width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #CBD5E1; font-size: 1rem; font-weight: 700; margin-bottom: 12px; text-align: center; box-sizing: border-box;">
        <button class="btn-action" id="submit-btn" onclick="submitScore()">📤 登記成績到成績單</button>
      </div>

      <div id="submit-status" style="font-size: 0.95rem; font-weight: 700; margin-bottom: 16px; display: none;"></div>

      <button class="btn-action" style="background: #94A3B8;" onclick="restartGame()">🔄 再玩一次</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        rule: "規則 1：一般形容詞直接＋est",
        sentence: "Jack is 140cm, Amy is 135cm, and Leo is 130cm.<br>Leo is the ______.",
        target: "short",
        options: ["shortest", "shorter", "shorttest", "most short"],
        answer: 0,
        tip: "short 是一般單音節形容詞，直接加 est 變成 the shortest！"
      },
      {
        rule: "規則 2：字尾是 e 時只加 st",
        sentence: "The puppy is the ______ pet in the house!",
        target: "cute",
        options: ["cuteest", "cutest", "cuter", "cuttest"],
        answer: 1,
        tip: "cute 字尾已經有 e，所以只要加上 st 變成 cutest！"
      },
      {
        rule: "規則 3：子音＋y，去 y 變 i 加 est",
        sentence: "He didn't eat lunch today.<br>He is the ______ student now.",
        target: "hungry",
        options: ["hungryest", "hungriest", "hungrier", "hungriestest"],
        answer: 1,
        tip: "hungry 字尾是子音+y，要把 y 去掉改成 i＋est = hungriest！"
      },
      {
        rule: "規則 4：短母音＋單子音，重複字尾＋est",
        sentence: "This is the ______ apple on the tree. 🍎",
        target: "big",
        options: ["bigest", "biggest", "biger", "more big"],
        answer: 1,
        tip: "big 是短母音(i)配子音(g)，要重複字尾 g 再加 est = biggest！"
      },
      {
        rule: "規則 5：不規則變化（需特別背誦）",
        sentence: "Lily got 100 points! Her score is the ______ in our class.",
        target: "good",
        options: ["goodest", "better", "best", "gooder"],
        answer: 2,
        tip: "good 的最高級是不規則變化：good → better → best！"
      },
      {
        rule: "重點回顧：三個以上比較 & 一定要加 the",
        sentence: "Jack’s mom is shorter than Jack.<br>So Jack’s mom is ______.",
        target: "重點句型",
        options: ["shortest", "the shortest", "the shorter", "a shortest"],
        answer: 1,
        tip: "最高級句型：主詞 + be動詞 + the + 最高級，記得前面一定要有「the」！"
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    // === Google 表單自動回傳設定 ===
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSf2vqdhfafv8C_C-AxzPYhjh1l7oRjIdDIeFuXvPKi7TuTb2A/formResponse";
    const ENTRY_NAME = "entry.1895102090";
    const ENTRY_SCORE = "entry.191608318";

    function loadQuestion() {
      answered = false;
      const q = quizData[currentIdx];
      
      document.getElementById("question-progress").innerText = `第 ${currentIdx + 1} / ${quizData.length} 題`;
      document.getElementById("current-score").innerText = score;
      document.getElementById("rule-tag").innerText = q.rule;
      document.getElementById("question-text").innerHTML = `${q.sentence}<br><small style="color:#64748B; font-size:0.9rem;">(提示詞: <span class="target-word">${q.target}</span>)</small>`;
      
      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optContainer.appendChild(btn);
      });

      document.getElementById("feedback-text").innerHTML = "";
      document.getElementById("next-btn").style.display = "none";
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = quizData[currentIdx];
      const buttons = document.querySelectorAll(".btn-option");

      buttons.forEach(btn => btn.disabled = true);

      const feedback = document.getElementById("feedback-text");

      if (selectedIdx === q.answer) {
        buttons[selectedIdx].classList.add("correct");
        score += 20;
        document.getElementById("current-score").innerText = score;
        feedback.innerHTML = `<span style="color: var(--success);">🎉 答對了！ ${q.tip}</span>`;
      } else {
        buttons[selectedIdx].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedback.innerHTML = `<span style="color: var(--error);">💡 差一點點！ ${q.tip}</span>`;
      }

      document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < quizData.length) {
        loadQuestion();
      } else {
        showEndScreen();
      }
    }

    function showEndScreen() {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("end-screen").style.display = "block";
      document.getElementById("final-score").innerText = score + " 分";
    }

    function submitScore() {
      const nameInput = document.getElementById("player-name");
      const playerName = nameInput.value.trim();
      const statusDiv = document.getElementById("submit-status");
      const submitBtn = document.getElementById("submit-btn");

      if (!playerName) {
        alert("請先輸入名字再送出喔！");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "登記中...";

      const formData = new FormData();
      formData.append(ENTRY_NAME, playerName);
      formData.append(ENTRY_SCORE, score);

      fetch(FORM_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      })
      .then(() => {
        statusDiv.style.display = "block";
        statusDiv.style.color = "var(--success)";
        statusDiv.innerText = "✅ 成績已成功送出！我們已收到囉。";
        document.getElementById("submit-section").style.display = "none";
      })
      .catch((err) => {
        statusDiv.style.display = "block";
        statusDiv.style.color = "var(--error)";
        statusDiv.innerText = "❌ 送出失敗，請檢查網路連線。";
        submitBtn.disabled = false;
        submitBtn.innerText = "重試一次";
      });
    }

    function restartGame() {
      currentIdx = 0;
      score = 0;
      document.getElementById("submit-section").style.display = "block";
      document.getElementById("submit-status").style.display = "none";
      document.getElementById("player-name").value = "";
      document.getElementById("submit-btn").disabled = false;
      document.getElementById("submit-btn").innerText = "📤 登記成績到成績單";
      
      document.getElementById("end-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      loadQuestion();
    }

    // 啟動遊戲
    loadQuestion();
  </script>
</body>
</html>
